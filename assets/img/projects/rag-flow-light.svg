<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="How it works: ingestion and question answering">
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#131922}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#556170}
  .faint{fill:#5F6B79}
  .h{font-weight:700;letter-spacing:-.01em}

  .blink{animation:blink 2.8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .flowline{stroke-dasharray:5 9;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}
  .gate{transform-box:fill-box;transform-origin:center;animation:gate 3s ease-in-out infinite}
  @keyframes gate{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.traveler{display:none}}
</style>
