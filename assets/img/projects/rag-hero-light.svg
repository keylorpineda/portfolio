<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Research Engine: answers from your documents with their sources">
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#131922}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#556170}
  .faint{fill:#5F6B79}
  .h{font-weight:700;letter-spacing:-.01em}

  .blink{animation:blink 2.8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .c1 rect,.c2 rect,.c3 rect{animation-duration:7.5s;animation-iteration-count:infinite}
  .c1 rect{animation-name:on1}.c2 rect{animation-name:on2}.c3 rect{animation-name:on3}
  .c1 text,.c2 text,.c3 text{animation-duration:7.5s;animation-iteration-count:infinite}
  .c1 text{animation-name:t1}.c2 text{animation-name:t2}.c3 text{animation-name:t3}
  .s1,.s2,.s3{animation-duration:7.5s;animation-iteration-count:infinite}
  .s1{animation-name:b1}.s2{animation-name:b2}.s3{animation-name:b3}
  @keyframes on1{0%,4%,30%,100%{fill:#E1F1EC}8%,26%{fill:#2E7564}}
  @keyframes on2{0%,37%,63%,100%{fill:#E1F1EC}41%,59%{fill:#2E7564}}
  @keyframes on3{0%,70%,96%,100%{fill:#E1F1EC}74%,92%{fill:#2E7564}}
  @keyframes t1{0%,4%,30%,100%{fill:#1F5A4C}8%,26%{fill:#FFFFFF}}
  @keyframes t2{0%,37%,63%,100%{fill:#1F5A4C}41%,59%{fill:#FFFFFF}}
  @keyframes t3{0%,70%,96%,100%{fill:#1F5A4C}74%,92%{fill:#FFFFFF}}
  @keyframes b1{0%,4%,30%,100%{stroke:#E3E8EE}8%,26%{stroke:#2E7564}}
  @keyframes b2{0%,37%,63%,100%{stroke:#E3E8EE}41%,59%{stroke:#2E7564}}
  @keyframes b3{0%,70%,96%,100%{stroke:#E3E8EE}74%,92%{stroke:#2E7564}}
  .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .r2{animation-delay:.12s}.r3{animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.traveler{display:none}}
</style>
<rect x=".5" y=".5" width="1199" height="339" rx="24" fill="#FFFFFF" stroke="#E3E8EE"/>

<g class="rise"><g transform="translate(56 58) scale(1.714)"><path d="M10 5H6v18h4" fill="none" stroke="#2E7564" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 5h4v18h-4" fill="none" stroke="#2E7564" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle class="blink" cx="14" cy="14" r="2.4" fill="#131922"/></g></g>
<text class="rise r2 h" x="56" y="168" font-size="50">Research Engine</text>
<text class="rise r3 muted" x="58" y="208" font-size="19">Answers from your documents, with the sources they come from,</text>
<text class="rise r3 muted" x="58" y="236" font-size="19">and no answer when the evidence is not there.</text>
<g class="rise r3">
<rect x="58" y="262" width="152" height="32" rx="16" fill="#E1F1EC"/><text x="134.0" y="283" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1F5A4C">pgvector · HNSW</text>
<rect x="220" y="262" width="130" height="32" rx="16" fill="#F6F8FA"/><text x="285.0" y="283" font-size="13.5" font-weight="600" text-anchor="middle" fill="#556170">hybrid search</text>
